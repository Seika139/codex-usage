[tools]
dprint = "0.64.1"
fzf = "0.74.5"
python = "3.15.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.13.1"
yamllint = "1.38.0"

[tasks.permit]
description = "mise タスクに権限を付与する"
quiet = true
run = [
  "test -d mise/ && find mise/ -type f -name '*.sh' -exec chmod +x {} +",
  "test -d mise/tasks/ && find mise/tasks/ -type f -name '*.sh' -exec chmod +x {} +",
]

[tasks.status]
description = "Read current Codex rate limits as JSON"
quiet = true
run = "python -m codex_usage status"

[tasks.collect]
description = "Save current Codex rate limits and print the snapshot as JSON"
quiet = true
run = "python -m codex_usage collect"

[tasks.history]
description = "Show recent usage history"
quiet = true
raw_args = true
run = "python -m codex_usage history"
