---
name: Check uv lock and Ruff formatting

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Check uv.lock
        run: uv lock --check
      - name: Check Ruff lint and formatting
        run: mise run lint
