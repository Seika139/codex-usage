[project]
name = "codex-usage"
version = "0.1.0"
description = "A cross-platform CLI for reading Codex usage and rate limits."
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "discord-notify @ git+https://github.com/Seika139/discord-notify@3d50c1188cd9a85a9da4fdb5d4415e276f07f213",
]

[dependency-groups]
dev = ["ruff>=0.16.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
